name: le-fabrique

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-le_fabrique}
      POSTGRES_USER: ${POSTGRES_USER:-le_fabrique}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.4.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?configure DATABASE_URL}
      REDIS_URL: redis://redis:6379
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?configure ADMIN_API_TOKEN}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?configure WORKER_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 1
      CONTROL_API_URL: http://api:3000/api
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?configure WORKER_API_TOKEN}
      WORKER_ID: ${WORKER_ID:?configure WORKER_ID}
      WORKER_NAME: control-worker-1
      WORKER_HEARTBEAT_INTERVAL_MS: 5000
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [edge]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
