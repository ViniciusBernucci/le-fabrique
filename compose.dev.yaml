name: le-fabrique-dev

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: le_fabrique
      POSTGRES_USER: le_fabrique
      POSTGRES_PASSWORD: le_fabrique_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U le_fabrique -d le_fabrique"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.4.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
